name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Style gate (CODE_STYLE mechanically-decidable rules)
        run: node scripts/check-style.mjs

      - name: Lint gate (type-aware promise rules)
        run: pnpm run lint

      - name: "Build (ordered: mimir tsc+bundle, then ui-mimir tsc+bundle)"
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

